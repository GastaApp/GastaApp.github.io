<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GastaApp</title>
    <base href="/" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('gasta-theme'); // matches ThemeService.StorageKey
                var theme = saved === 'Dark' ? 'dark' : 'light';  // matches ThemeService's casing
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/theme.css?v=3" />
    <link rel="stylesheet" href="css/app.css?v=3" />
    <link rel="icon" type="image/png" href="gasta.png" />
    <link href="GastaApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="gastalogo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="gasta.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-ring-wrap">
                <svg class="loading-ring" viewBox="0 0 120 120">
                    <circle class="loading-ring-track" cx="60" cy="60" r="54" />
                    <circle class="loading-ring-bar" cx="60" cy="60" r="54" />
                </svg>
                <div class="loading-video-wrap">
                    <div class="loading-video-crop">
                        <img class="loading-video" src="images/gasta-icon-square.gif" alt="Gasta" />
                    </div>
                </div>
            </div>
            <div class="loading-percentage"></div>
            <div class="loading-text">Loading Gasta<span class="loading-dots"><span></span><span></span><span></span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/pointer.js"></script>
    <script src="js/export.js"></script>
    <script src="js/settingsHeader.js"></script>
    <script src="js/accentColor.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
            .then(reg => {
                // Proactively ask the browser to re-check for an update right away,
                // rather than waiting for its own internal timing. Still only works
                // if the fetched service-worker.js is actually byte-different from
                // what's installed — this doesn't replace the build-stamping fix,
                // it just makes sure a real update is noticed as soon as possible
                // once that fix is in place.
                reg.update();
            });

        let hasReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hasReloaded) return;
            hasReloaded = true;
            window.location.reload();
        });
    </script>
</body>

</html>
